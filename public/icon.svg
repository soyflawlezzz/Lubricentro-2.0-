<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="100" fill="url(#gradBg)" />
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#dc2626" stroke-width="8" stroke-dasharray="8 8" opacity="0.4"/>
  <rect x="24" y="24" width="464" height="464" rx="76" fill="none" stroke="#ef4444" stroke-width="4"/>
  
  <!-- Outer Gear Accent -->
  <circle cx="256" cy="220" r="160" fill="none" stroke="#334155" stroke-width="8" stroke-dasharray="16 12"/>
  
  <!-- Central Oil Droplet & Mechanics -->
  <path d="M256 90 C256 90, 160 210, 160 270 C160 325 203 368 256 368 C309 368 352 325 352 270 C352 210, 256 90, 256 90 Z" fill="url(#redGrad)" filter="drop-shadow(0px 8px 16px rgba(220, 38, 38, 0.4))"/>
  
  <!-- Droplet shine -->
  <path d="M210 240 C200 270, 210 320, 240 335" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Crossed Wrench Silhouette in drop -->
  <circle cx="256" cy="265" r="42" fill="#ffffff" opacity="0.15" />
  
  <!-- Text Badge LUBRICENTRO 2.0 -->
  <rect x="64" y="390" width="384" height="64" rx="16" fill="#dc2626" />
  <text x="256" y="432" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">LUBRICENTRO 2.0</text>
</svg>
