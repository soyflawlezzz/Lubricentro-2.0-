<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <!-- Red racing gradient for 2.0 -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="50%" stop-color="#e01212" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <!-- Chrome highlight for script text -->
    <linearGradient id="chromeScript" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f8fafc" />
      <stop offset="85%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Drop shadows -->
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Group with shadow -->
  <g filter="url(#logoShadow)">
    
    <!-- ====== 2.0 BOLD RACING LOGO BACKGROUND (Under script) ====== -->
    <g transform="skewX(-16)">
      <!-- 2 -->
      <path d="M 120 185
               C 120 160, 150 145, 230 145
               C 320 145, 345 170, 345 205
               C 345 245, 290 265, 220 290
               L 355 290
               L 345 330
               L 115 330
               L 125 290
               C 210 255, 280 235, 280 205
               C 280 185, 260 178, 220 178
               C 170 178, 155 195, 145 215
               Z"
            fill="url(#redGradient)"
            stroke="#111111"
            stroke-width="12"
            stroke-linejoin="round" />

      <!-- DOT / HYPHEN SEPARATOR -->
      <rect x="365" y="275" width="45" height="45" rx="6"
            fill="url(#redGradient)"
            stroke="#111111"
            stroke-width="12"
            stroke-linejoin="round" />

      <!-- 0 -->
      <path d="M 470 145
               C 560 145, 610 175, 610 238
               C 610 300, 560 330, 470 330
               C 380 330, 330 300, 330 238
               C 330 175, 380 145, 470 145 Z
               M 470 182
               C 425 182, 395 198, 395 238
               C 395 278, 425 293, 470 293
               C 515 293, 545 278, 545 238
               C 545 198, 515 182, 470 182 Z"
            fill="url(#redGradient)"
            stroke="#111111"
            stroke-width="12"
            stroke-linejoin="round"
            fill-rule="evenodd" />
            
      <!-- Inner racing accents on 2 and 0 -->
      <path d="M 170 305 L 320 305" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4" />
      <path d="M 430 162 C 455 156, 485 156, 510 162" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>

    <!-- ====== "Lubricentro" CALLIGRAPHIC CURSIVE SCRIPT ====== -->
    <g transform="translate(60, 20)">
      <!-- Black stroke outline / shadow layer -->
      <text x="30" y="115"
            font-family="'Brush Script MT', 'Dancing Script', 'Pacifico', 'Caveat', 'Segoe Script', cursive, sans-serif"
            font-size="108"
            font-weight="bold"
            font-style="italic"
            letter-spacing="-1"
            fill="#090d16"
            stroke="#090d16"
            stroke-width="18"
            stroke-linejoin="round">
        Lubricentro
      </text>

      <!-- Mid stroke layer -->
      <text x="30" y="115"
            font-family="'Brush Script MT', 'Dancing Script', 'Pacifico', 'Caveat', 'Segoe Script', cursive, sans-serif"
            font-size="108"
            font-weight="bold"
            font-style="italic"
            letter-spacing="-1"
            fill="#ffffff"
            stroke="#1e293b"
            stroke-width="6"
            stroke-linejoin="round">
        Lubricentro
      </text>

      <!-- Chrome / white foreground text -->
      <text x="30" y="115"
            font-family="'Brush Script MT', 'Dancing Script', 'Pacifico', 'Caveat', 'Segoe Script', cursive, sans-serif"
            font-size="108"
            font-weight="bold"
            font-style="italic"
            letter-spacing="-1"
            fill="url(#chromeScript)">
        Lubricentro
      </text>
    </g>

  </g>
</svg>
